<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1830" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Pick My Degree: find your ideal university degree through a tournament of choices. Covers the first-cycle degrees of Politecnico di Torino and Università di Torino." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pick My Degree" />
    <meta property="og:description" content="Discover your ideal university degree through a tournament of choices." />
    <meta property="og:url" content="https://pick-my-degree.surge.sh/" />
    <title>Pick My Degree</title>
    <style>
      body { margin: 0; min-height: 100vh; background: #0B1830; color: #DEEFFF; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; }
      #app-loading { padding: 1.5rem; text-align: center; }
      #app-loading a { color: #6AAEF5; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">Pick My Degree…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <script>
      setTimeout(function() {
        var loading = document.getElementById('app-loading');
        if (loading) {
          var it = (navigator.language || '').indexOf('it') === 0;
          var isLocalDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
          var msg = it
            ? 'Se l’app non si è caricata, <a href="">ricarica la pagina</a>.'
            : 'If the app didn’t load, please <a href="">reload the page</a>.';
          if (isLocalDev) {
            msg += it
              ? ' Sviluppo locale: prova <code>docker compose down && docker compose up dev</code>.'
              : ' For local dev, try <code>docker compose down && docker compose up dev</code>.';
          }
          loading.innerHTML = msg;
        }
      }, 5000);
    </script>
  </body>
</html>
